<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 450px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #1a73e8;
            color: white;
            padding: 16px 20px;
        }

        .chat-header h2 {
            font-size: 18px;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        #username-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        #username-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }

        #username-bar input:focus {
            border-color: #1a73e8;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 80%;
            padding: 8px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.received {
            background: #e8f0fe;
            color: #1a1a1a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .sender {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 2px;
            color: #1a73e8;
        }

        .message.system {
            background: #f1f3f4;
            color: #666;
            font-size: 12px;
            align-self: center;
            border-radius: 10px;
            padding: 4px 12px;
        }

        #input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
        }

        #message-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            resize: none;
        }

        #message-input:focus {
            border-color: #1a73e8;
        }

        #send-btn {
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #send-btn:hover {
            background: #1558b0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Chat en Tiempo Real</h2>
            <p>Programación Avanzada II – CETI</p>
        </div>

        <div id="username-bar">
            <input type="text" id="username" placeholder="Tu nombre..." maxlength="20">
        </div>

        <div id="messages"></div>

        <div id="input-area">
            <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">
            <button id="send-btn">&#9658;</button>
        </div>
    </div>

    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const usernameInput = document.getElementById('username');
        const sendBtn = document.getElementById('send-btn');

        socket.on('connect', () => {
            addSystemMessage('Conectado al servidor');
        });

        socket.on('disconnect', () => {
            addSystemMessage('Desconectado del servidor');
        });

        socket.on('message', (data) => {
            const parsed = JSON.parse(data);
            addMessage(parsed.user, parsed.text);
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            const user = usernameInput.value.trim() || 'Anónimo';
            if (!text) return;

            const data = JSON.stringify({ user, text });
            socket.send(data);
            messageInput.value = '';
        }

        function addMessage(user, text) {
            const div = document.createElement('div');
            div.classList.add('message', 'received');
            div.innerHTML = `<div class="sender">${escapeHtml(user)}</div>${escapeHtml(text)}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.classList.add('message', 'system');
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
